<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8eae7">
  <meta name="description" content="Escolha seus bolos da Manacá, monte seu carrinho e faça seu pedido pelo WhatsApp.">
  <title>Manacá Bolos · Cardápio</title>
  <link rel="icon" href="assets/marca.png">
  <link rel="stylesheet" href="estilo.css">
  <script src="cardapio.js" defer></script>
  <script src="loja.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 7.5h14l1.3 13H3.7zM8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M20.8 11.7a8.9 8.9 0 0 1-13.2 7.9l-4.6 1.2 1.3-4.4A8.9 8.9 0 1 1 20.8 11.7Z"/><path d="M8.4 7.2c-.4-.3-1 .1-1.2.7-.7 2 1.6 5.1 3.4 6.4 1.7 1.3 4.1 2.3 5.3 1 .3-.3.7-1.1.4-1.4l-2.1-1.1-.9 1c-1.4-.5-2.6-1.5-3.4-2.8l.8-1.1-1-2.4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.7" y="3.7" width="6.4" height="6.4" rx="1.3"/><rect x="13.9" y="3.7" width="6.4" height="6.4" rx="1.3"/><rect x="3.7" y="13.9" width="6.4" height="6.4" rx="1.3"/><rect x="13.9" y="13.9" width="6.4" height="6.4" rx="1.3"/></symbol>
    <symbol id="i-homecake" viewBox="0 0 24 24"><ellipse cx="12" cy="8" rx="7.8" ry="3.4"/><ellipse cx="12" cy="7.9" rx="2.5" ry="1.1"/><path d="m4.2 8-1 8c0 2 4 3.7 8.8 3.7s8.8-1.7 8.8-3.7l-1-8"/></symbol>
    <symbol id="i-slice" viewBox="0 0 24 24"><path d="m3.5 11 13.3-5.6 3.8 4.2v9.8h-17zM3.5 11l17.1-1.4M4 15.3c2.6 1.9 4.6-2.6 7.4-.8 2.8 1.8 4.4-2.4 8.9-1.5"/><path d="M13.5 5.7c-1-2 .7-3.1 2-2.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5m4-5v5"/></symbol>
    <symbol id="i-flower" viewBox="0 0 32 32"><g fill="currentColor" stroke="none"><ellipse cx="16" cy="8" rx="4.3" ry="7"/><ellipse cx="16" cy="8" rx="4.3" ry="7" transform="rotate(60 16 16)"/><ellipse cx="16" cy="8" rx="4.3" ry="7" transform="rotate(120 16 16)"/><ellipse cx="16" cy="8" rx="4.3" ry="7" transform="rotate(180 16 16)"/><ellipse cx="16" cy="8" rx="4.3" ry="7" transform="rotate(240 16 16)"/><ellipse cx="16" cy="8" rx="4.3" ry="7" transform="rotate(300 16 16)"/><circle cx="16" cy="16" r="2.8" fill="#fff8ee"/></g></symbol>
  </svg>
  <a href="#cardapio" class="skip">Pular para o cardápio</a>
  <button class="cart-launch" id="abrir-carrinho" aria-haspopup="dialog" aria-label="Abrir carrinho, 0 itens"><svg class="ic"><use href="#i-bag"/></svg><span>Carrinho</span><b id="contador">0</b></button>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-in wrap">
        <div class="brand"><img src="assets/marca.png" alt="" width="49" height="47"><img src="assets/nome.png" alt="Manacá Bolos" width="150" height="32"></div>
        <div class="hero-copy">
          <h1 id="hero-title">Uma fatia<br><em>de carinho.</em></h1>
          <p>Dos caseirinhos para o café aos recheados<br class="desk-break"> para celebrar.</p>
          <div class="hero-actions">
            <a class="btn primary" href="#cardapio"><svg class="ic"><use href="#i-slice"/></svg>Ver cardápio</a>
            <a class="contact" data-contato target="_blank" rel="noopener"><svg class="ic"><use href="#i-wa"/></svg>Falar com a loja</a>
          </div>
        </div>
        <figure class="hero-art">
          <div class="arch-line"></div>
          <div class="arch"><img src="assets/amanteigado.webp" width="780" height="1014" fetchpriority="high" alt="Bolo amanteigado da Manacá servido ao lado de uma xícara de café"></div>
          <img class="sprig sprig-top" src="assets/ramo.svg" alt="">
          <img class="sprig sprig-base" src="assets/ramo.svg" alt="">
          <figcaption>Bolo amanteigado</figcaption>
        </figure>
      </div>
      <svg class="wave" viewBox="0 0 1440 50" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22C215 59 365 41 575 24S957 5 1180 25s199 12 260 1v24H0Z"/></svg>
    </section>
    <section id="cardapio" class="menu wrap" aria-labelledby="menu-title">
      <div class="menu-title"><h2 id="menu-title">Nosso cardápio</h2><svg class="flower"><use href="#i-flower"/></svg></div>
      <div class="menu-tools">
        <div class="filters" role="group" aria-label="Filtrar bolos por categoria">
          <button type="button" data-filtro="Todos" aria-pressed="true"><svg class="ic"><use href="#i-grid"/></svg>Todos</button>
          <button type="button" data-filtro="Caseirinhos" aria-pressed="false"><svg class="ic"><use href="#i-homecake"/></svg>Caseirinhos</button>
          <button type="button" data-filtro="Recheados" aria-pressed="false"><svg class="ic"><use href="#i-slice"/></svg>Recheados</button>
        </div>
        <span id="resultado" class="result-count" role="status"></span>
      </div>
      <div id="produtos" class="products"></div>
      <noscript>Ative o JavaScript para montar seu carrinho. Você também pode fazer seu pedido pelo WhatsApp no número (84) 99618-7906.</noscript>
    </section>
  </main>
  <footer><div class="wrap foot"><img src="assets/nome.png" alt="Manacá Bolos" width="130" height="27"><a data-contato target="_blank" rel="noopener"><svg class="ic"><use href="#i-wa"/></svg>(84) 99618-7906</a></div></footer>
  <dialog id="produto-modal" class="product-modal" aria-labelledby="detalhe-nome">
    <button class="icon-btn modal-close" data-fechar aria-label="Fechar detalhes"><svg class="ic"><use href="#i-close"/></svg></button>
    <div id="detalhe"></div>
  </dialog>
  <dialog id="carrinho" class="drawer" aria-labelledby="titulo-carrinho">
    <div class="drawer-in">
      <div class="drawer-heading"><h2 id="titulo-carrinho">Seu carrinho</h2><button class="icon-btn" data-fechar aria-label="Fechar carrinho"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="itens" class="cart-items"></div>
      <div id="resumo" class="summary"></div>
    </div>
  </dialog>
  <div id="aviso" class="toast" role="status"></div>
</body>
</html>
